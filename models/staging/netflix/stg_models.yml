version: 2

models:

  - name: stg_titles
    description: "Clean staging representation of Netflix title data."

    columns:
      - name: show_id
        description: "Unique Netflix title identifier."
        data_tests:
          - not_null
          - unique

  - name: stg_users
    description: "Clean staging representation of Netflix subscriber data."

    columns:
      - name: user_id
        description: "Unique Netflix user identifier."
        data_tests:
          - not_null
          - unique

  - name: stg_watch_history
    description: "Clean staging representation of Netflix viewing activity."

    columns:
      - name: watch_id
        description: "Unique viewing event identifier."
        data_tests:
          - not_null
          - unique

      - name: user_id
        description: "User associated with the viewing event."

      - name: show_id
        description: "Netflix title associated with the viewing event."